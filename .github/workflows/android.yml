name: Build APK

# Builds on every push and pull request.
# When versionName in app/build.gradle.kts changes on main, a GitHub Release
# is created automatically with the APK attached. Release notes come from
# release-notes/v<version>.md if that file exists.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Read version
        id: ver
        run: |
          V=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$V" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -f "release-notes/v$V.md" ]; then
            echo "notes=release-notes/v$V.md" >> "$GITHUB_OUTPUT"
          else
            printf 'Lastmark v%s\n' "$V" > release-notes-auto.md
            echo "notes=release-notes-auto.md" >> "$GITHUB_OUTPUT"
          fi

      - name: Name the APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "lastmark-v${{ steps.ver.outputs.version }}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk lastmark.apk

      - uses: actions/upload-artifact@v4
        with:
          name: lastmark-apk
          path: lastmark-v${{ steps.ver.outputs.version }}.apk

      - name: Release new version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.ver.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Lastmark v${{ steps.ver.outputs.version }}
          body_path: ${{ steps.ver.outputs.notes }}
          make_latest: true
          files: |
            lastmark-v${{ steps.ver.outputs.version }}.apk
            lastmark.apk

      - name: Attach to tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            lastmark-v${{ steps.ver.outputs.version }}.apk
            lastmark.apk
